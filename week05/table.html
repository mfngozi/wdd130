<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Exercise | WDD 130</title>
    <link rel="stylesheet" href="styles/table.css">
</head>

<body>

    <table>
        <thead>
            <tr>
                <th colspan="4">Employee Information</th>
            </tr>
            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Position</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">John Smith</td>
                <td>Sales</td>
                <td>Manager</td>
                <td>$65,000</td>
            </tr>
            <tr>
                <td>Marketing</td>
                <td>Consultant</td>
                <td>$60,000</td>
            </tr>
            <tr>
                <td>Mary Jones</td>
                <td>Finance</td>
                <td>Accountant</td>
                <td>$58,000</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total Employees</td>
                <td>3</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
