<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact us | White Water Rafting</title>

    <meta name="description"
      content="contact white water Rafting for reservations, questions, and customer support.">

    <meta name="author" content="Mmadu Favour Ngozi">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/logo.png" alt="Rafting Company Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="contact-info">
            <h2>Company Information</h2>

            <p><strong>Address:</strong> 123 River Road, Adventure City</p>
            <p><strong>Phone:</strong> +234 800 123 4567</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <iframe src="https://www.google.com/maps/embed?pb=!1m18..." loading="lazy"
              allowfullscreen>
            </iframe>
        </section>

        <section class="employees">

            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpeg" alt="Operations Manager">
                <figcaption>John Smith – Operations Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpeg" alt="Senior River Guide">
                <figcaption>Sarah Johnson – Senior River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpeg" alt="Customer Service Manager">
                <figcaption>David Brown – Customer Service Manager</figcaption>
            </figure>

        </section>

        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <p>Purpose of Message</p>

                <label>
                    <input type="radio" name="purpose" value="general">
                    General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" value="website">
                    Website Suggestion
                </label>

                <label for="message">Message</label>

                <textarea id="message" name="message" rows="6"></textarea>

                <label>
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            © 2026 White Water Rafting | Mmadu Favour Ngozi
        </p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram">
            </a>

            <a href="https://twitter.com">
                <img src="images/twitter.jpg" alt="Twitter">
            </a>

        </nav>

    </footer>

</body>

</html>
